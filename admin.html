<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Makerobot Semi-Auto Tracer</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --red-gear: #e72429;
            --blue-gear: #1f4179;
            --tracer-grad: linear-gradient(90deg, #5c4300 0%, #e6a800 100%);
            --gold-accent: #e6a800;
            --bg-dark: #090c10;
            --panel-bg: #111822;
            --border-glow: #1f4179;
        }

        body { 
            font-family: 'Rajdhani', sans-serif; 
            background-color: var(--bg-dark); 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            background-image: radial-gradient(circle at 50% 50%, rgba(31, 65, 121, 0.2) 0%, transparent 60%); 
        }
        
        .logo-container { margin-bottom: 20px; text-align: center;}
        .logo-container img { max-width: 220px; filter: drop-shadow(0 0 10px rgba(230,168,0,0.15)); }
        
        .login-box { 
            background: var(--panel-bg); 
            padding: 40px 30px; 
            border-radius: 12px; 
            box-shadow: 0 0 30px rgba(0,0,0,0.8); 
            text-align: center; 
            width: 100%; 
            max-width: 320px; 
            border: 1px solid var(--border-glow); 
            position: relative; 
            overflow: hidden;
        }
        .login-box::before { 
            content: ''; 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 4px; 
            background: var(--tracer-grad); 
        }

        h2 { font-family: 'Orbitron', sans-serif; color: white; margin-top: 0; margin-bottom: 5px; letter-spacing: 2px;}
        .sub-title { font-family: 'Orbitron', sans-serif; color: var(--gold-accent); font-size: 11px; margin-bottom: 25px; letter-spacing: 1px;}
        
        input { 
            width: 100%; 
            padding: 12px; 
            margin: 10px 0; 
            border: 1px solid #30363d; 
            border-radius: 4px; 
            box-sizing: border-box; 
            background: #0d1117; 
            color: white; 
            font-family: 'Rajdhani', sans-serif; 
            font-size: 16px;
        }
        input:focus { outline: none; border-color: var(--gold-accent); box-shadow: 0 0 8px rgba(230, 168, 0, 0.4); }
        
        button { 
            width: 100%; 
            padding: 12px; 
            margin-top: 15px; 
            background: var(--tracer-grad); 
            color: white; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
            font-weight: bold; 
            font-family: 'Orbitron', sans-serif; 
            letter-spacing: 1px; 
            transition: 0.3s;
        }
        button:hover { filter: brightness(1.2); box-shadow: 0 0 15px rgba(230, 168, 0, 0.5);}
        
        a { display: inline-block; margin-top: 20px; font-size: 12px; color: #8b949e; text-decoration: none; font-family: 'Orbitron', sans-serif; transition: 0.3s;}
        a:hover { color: white; }
    </style>
</head>
<body>

<div class="logo-container">
    <img src="[FINAL] LOGO MAKEROBOT2026 (8)-Photoroom.png" alt="Makerobot Semi-Auto Tracer Logo">
</div>

<div class="login-box">
    <h2>SYSTEM ACCESS</h2>
    <div class="sub-title">SEMI-AUTO TRACER CONTROL</div>
    
    <input type="email" id="email" placeholder="ADMIN ID (EMAIL)">
    <input type="password" id="password" placeholder="PASSCODE">
    <button onclick="login()">AUTHENTICATE</button>
    
    <a href="index.html">&larr; RETURN TO PUBLIC VIEW</a>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  // Your web app's Firebase configuration
  const firebaseConfig = {
    apiKey: "AIzaSyC70m3k8VSSIshbjPJuOizEADA8mBV79ug",
    authDomain: "makerobot-tracer-semi-auto.firebaseapp.com",
    projectId: "makerobot-tracer-semi-auto",
    storageBucket: "makerobot-tracer-semi-auto.firebasestorage.app",
    messagingSenderId: "384231222540",
    appId: "1:384231222540:web:a9c892c9c4c13698e7ed29"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  window.login = function() {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    if(!email || !password) return alert("CREDENTIALS REQUIRED.");

    signInWithEmailAndPassword(auth, email, password)
      .then((userCredential) => {
        window.location.href = "admin.html";
      })
      .catch((error) => {
        alert("AUTHENTICATION FAILED: " + error.message);
      });
  };
</script>

</body>
</html>
