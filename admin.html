<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Makerobot Semi-Auto Tracer</title>
    <!-- ADDED FAVICON -->
    <link rel="icon" type="image/png" href="TRACER.png">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        /* (Keep your existing CSS variables and style blocks here exactly as they were) */
        :root {
            --red-gear: #e72429;
            --blue-gear: #1f4179;
            --tracer-grad: linear-gradient(90deg, #5c4300 0%, #e6a800 100%);
            --gold-accent: #e6a800;
            --bg-dark: #090c10;
            --panel-bg: #111822;
            --border-glow: #1f4179;
            --text-main: #c9d1d9;
            --neon-green: #00ff88;
            --purple-accent: #9d4edd;
            --orange-warning: #ff9900;
        }

        body { 
            font-family: 'Rajdhani', sans-serif; 
            background-color: var(--bg-dark); 
            color: var(--text-main); 
            padding: 20px; 
            display: none; 
            background-image: radial-gradient(circle at 50% 0%, rgba(31, 65, 121, 0.2) 0%, transparent 50%);
        }
        .container { max-width: 950px; margin: 0 auto; background: var(--panel-bg); padding: 20px 30px; border-radius: 12px; box-shadow: 0 0 20px rgba(0,0,0,0.8); border: 1px solid var(--border-glow); }
        
        .header-panel { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #30363d; padding-bottom: 15px;}
        .header-controls { text-align: right; }
        .header-controls a { color: var(--gold-accent); text-decoration: none; font-weight: bold; font-family: 'Orbitron', sans-serif; font-size: 12px; margin-right: 15px; transition: 0.3s;}
        .header-controls a:hover { color: white; }
        
        .user-status-bar { display: flex; align-items: center; justify-content: flex-end; gap: 10px; margin-bottom: 8px; font-size: 13px; }
        .user-email { color: #8b949e; font-family: 'Rajdhani', sans-serif; font-weight: 600; }
        .role-badge { font-family: 'Orbitron', sans-serif; font-size: 10px; font-weight: 900; padding: 3px 8px; border-radius: 4px; text-transform: uppercase; letter-spacing: 1px; }
        .role-super { background: rgba(157, 78, 221, 0.2); color: var(--purple-accent); border: 1px solid var(--purple-accent); }
        .role-admin { background: rgba(31, 65, 121, 0.3); color: #79c0ff; border: 1px solid var(--blue-gear); }

        h1, h2, h3 { font-family: 'Orbitron', sans-serif; color: white; text-transform: uppercase; letter-spacing: 1px;}
        
        /* (The rest of your admin CSS remains exactly the same...) */
        .tab-menu { display: flex; border-bottom: 2px solid #30363d; margin-bottom: 25px; }
        .tab-btn { flex: 1; padding: 12px; cursor: pointer; background: rgba(0,0,0,0.3); border: 1px solid transparent; font-size: 15px; font-weight: bold; color: #8b949e; font-family: 'Orbitron', sans-serif; transition: 0.3s; }
        .tab-btn:hover { background: rgba(31, 65, 121, 0.3); color: white;}
        .tab-btn.active { background: var(--panel-bg); color: white; border: 1px solid #30363d; border-bottom: 2px solid var(--panel-bg); margin-bottom: -2px; border-top: 2px solid var(--gold-accent);}
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        input[type="text"] { padding: 10px; width: 65%; border: 1px solid #30363d; border-radius: 4px; background: #0d1117; color: white; font-family: 'Rajdhani', sans-serif; font-size: 16px;}
        input:focus { outline: none; border-color: var(--gold-accent); box-shadow: 0 0 8px rgba(230, 168, 0, 0.4); }
        
        button { padding: 10px 15px; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-family: 'Orbitron', sans-serif; letter-spacing: 1px; text-transform: uppercase; transition: 0.2s;}
        button.btn-primary { background: var(--tracer-grad); box-shadow: 0 4px 15px rgba(230, 168, 0, 0.3); }
        button.btn-primary:hover { filter: brightness(1.2); }
        button.btn-blue { background-color: var(--blue-gear); }
        button.btn-red { background-color: var(--red-gear); }
        button.btn-green { background-color: #27ae60; color: white; }
        button.btn-orange { background-color: var(--orange-warning); color: black; }
        button.btn-manage { background-color: #f39c12; color: black; }
        button.btn-restart { background-color: #9e58cc; padding: 5px 10px; font-size: 12px; }
        button.btn-pdf { background: linear-gradient(90deg, #7b2cbf 0%, #9d4edd 100%); color: white; box-shadow: 0 0 10px rgba(157, 78, 221, 0.4); }
        button.btn-pdf:hover { filter: brightness(1.2); }
        
        .logout { background-color: transparent; border: 1px solid var(--red-gear); color: var(--red-gear); font-size: 12px; padding: 5px 10px;}
        .logout:hover { background-color: var(--red-gear); color: white;}
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 15px;}
        td, th { padding: 12px; border: 1px solid #30363d; text-align: center; vertical-align: middle;}
        th { background: #0d1117; color: #8b949e; font-family: 'Orbitron', sans-serif; font-size: 13px;}
        .team-name { font-weight: bold; text-align: left; padding-left: 15px; color: white; font-size: 1.1em;}
        
        .timer-display { font-family: 'Orbitron', monospace; font-size: 1.1em; font-weight: 700; background: #0d1117; padding: 6px 10px; border-radius: 4px; border: 1px solid #30363d; display: inline-flex; justify-content: center; align-items: center; white-space: nowrap; }
        .digit-slot { display: inline-block; width: 0.75em; text-align: center; }
        
        .active-game-bar { background: rgba(31, 65, 121, 0.2); padding: 12px 20px; border-radius: 4px; color: #79c0ff; font-weight: bold; margin-bottom: 20px; border: 1px solid var(--blue-gear); display: none; font-family: 'Orbitron', sans-serif; justify-content: space-between; align-items: center; }
        .lock-msg { display: none; background: rgba(231, 36, 41, 0.1); padding: 15px; border-left: 4px solid var(--red-gear); margin-bottom: 15px; font-weight: bold; color: #ff7b72; font-family: 'Orbitron', sans-serif;}
        
        .mod-controls { display: flex; flex-direction: column; gap: 6px; justify-content: center; align-items: center; }
        .mod-btn { width: 130px; padding: 6px 10px; font-size: 11px; display: flex; justify-content: space-between; align-items: center; box-sizing: border-box; }
        .mod-count { background: rgba(0,0,0,0.5); padding: 2px 6px; border-radius: 8px; font-size: 11px; min-width: 16px; text-align: center; }
    </style>
</head>
<body id="adminBody">

<div class="container">
    <div class="header-panel">
        <!-- UPDATED HEADER WITH LOGO -->
        <div style="display: flex; align-items: center; gap: 15px;">
            <img src="TRACER.png" alt="Logo" style="height: 60px; border-radius: 8px;">
            <div>
                <div style="font-family: 'Orbitron', sans-serif; color: white; font-size: 22px; font-weight: 900; letter-spacing: 2px;">MAKEROBOT</div>
                <div style="font-family: 'Orbitron', sans-serif; color: var(--gold-accent); font-size: 14px; margin-top: 2px; letter-spacing: 2px;">SEMI-AUTO TRACER ADMIN</div>
            </div>
        </div>
        <div class="header-controls">
            <div class="user-status-bar">
                <span class="user-email" id="currentUserEmail">LOAD_USER...</span>
                <span class="role-badge" id="currentUserRole">VERIFYING...</span>
            </div>
            <a href="index.html" target="_blank">[ LAUNCH PUBLIC VIEWER ]</a>
            <button class="logout" onclick="logout()">LOGOUT</button>
        </div>
    </div>
    
    <!-- (The rest of your admin.html remains exactly the same below here!) -->
