<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Makerobot Tracer</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rajdhani:wght@600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Rajdhani', sans-serif; background: #090c10; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: #111822; padding: 30px; border-radius: 8px; border: 1px solid #1f4179; box-shadow: 0 0 20px rgba(0,0,0,0.8); width: 320px; text-align: center; }
        h2 { font-family: 'Orbitron', sans-serif; color: #e6a800; margin-bottom: 20px; font-size: 18px; letter-spacing: 1px; }
        input { width: 90%; padding: 10px; margin-bottom: 15px; background: #0d1117; border: 1px solid #30363d; color: white; border-radius: 4px; font-size: 14px; }
        button { width: 98%; padding: 10px; background: linear-gradient(90deg, #5c4300 0%, #e6a800 100%); border: none; color: white; font-family: 'Orbitron', sans-serif; font-weight: bold; cursor: pointer; border-radius: 4px; text-transform: uppercase; }
        button:hover { filter: brightness(1.2); }
        .error { color: #e72429; font-size: 13px; margin-top: 10px; display: none; }
    </style>
</head>
<body>

<div class="login-card">
    <h2>MAKEROBOT TRACER LOGIN</h2>
    <input type="email" id="email" placeholder="Admin Email">
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">AUTHENTICATE</button>
    <div id="error" class="error">INVALID CREDENTIALS</div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC70m3k8VSSIshbjPJuOizEADA8mBV79ug",
    authDomain: "makerobot-tracer-semi-auto.firebaseapp.com",
    projectId: "makerobot-tracer-semi-auto",
    storageBucket: "makerobot-tracer-semi-auto.firebasestorage.app",
    messagingSenderId: "384231222540",
    appId: "1:384231222540:web:a9c892c9c4c13698e7ed29"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  window.login = async function() {
      const email = document.getElementById("email").value;
      const pass = document.getElementById("password").value;
      const errEl = document.getElementById("error");

      try {
          await signInWithEmailAndPassword(auth, email, pass);
          window.location.href = "admin.html";
      } catch (err) {
          errEl.innerText = err.message;
          errEl.style.display = "block";
      }
  };
</script>
</body>
</html>
