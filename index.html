<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Leaderboard - Makerobot Semi-Auto Tracer</title>
    <!-- ADDED FAVICON -->
    <link rel="icon" type="image/png" href="TRACER.png">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        /* (Keep your existing CSS variables and style blocks here exactly as they were) */
        :root {
            --tracer-grad: linear-gradient(90deg, #5c4300 0%, #e6a800 100%);
            --gold-accent: #e6a800;
            --bg-dark: #090c10;
            --panel-bg: #111822;
            --border-glow: #1f4179;
            --text-main: #c9d1d9;
            --neon-green: #00ff88;
        }

        body { 
            font-family: 'Rajdhani', sans-serif; 
            background-color: var(--bg-dark); 
            color: var(--text-main); 
            padding: 20px; 
            margin: 0;
            background-image: radial-gradient(circle at 50% 0%, rgba(31, 65, 121, 0.2) 0%, transparent 60%);
        }
        
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #30363d; padding-bottom: 15px; margin-bottom: 20px;}
        .title-area h1 { font-family: 'Orbitron', sans-serif; color: white; margin: 0; font-size: 28px; letter-spacing: 2px;}
        .title-area h2 { font-family: 'Orbitron', sans-serif; color: var(--gold-accent); margin: 5px 0 0 0; font-size: 16px; letter-spacing: 3px;}
        
        .admin-link { color: #8b949e; text-decoration: none; font-family: 'Orbitron', sans-serif; font-size: 12px; font-weight: bold; border: 1px solid #30363d; padding: 5px 10px; border-radius: 4px; transition: 0.3s; }
        .admin-link:hover { background: rgba(255,255,255,0.1); color: white;}

        .selector-box { background: var(--panel-bg); padding: 20px; border-radius: 8px; border: 1px solid var(--border-glow); text-align: center; margin-bottom: 20px;}
        select { padding: 10px; font-size: 16px; font-family: 'Rajdhani', sans-serif; background: #0d1117; color: white; border: 1px solid var(--gold-accent); border-radius: 4px; width: 300px; }
        
        .leaderboard-container { display: none; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 18px;}
        th { background: #0d1117; color: #8b949e; font-family: 'Orbitron', sans-serif; padding: 15px; border-bottom: 2px solid var(--gold-accent); text-align: center; letter-spacing: 1px; font-size: 14px;}
        td { padding: 15px; border-bottom: 1px solid #30363d; text-align: center; vertical-align: middle; background: rgba(17, 24, 34, 0.6); transition: all 0.5s ease;}
        
        tr.active-run td { background: rgba(31, 65, 121, 0.4); border-left: 3px solid var(--neon-green);}
        
        .rank-col { font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 20px; color: #8b949e; width: 80px;}
        .rank-1 { color: #ffd700; text-shadow: 0 0 10px rgba(255,215,0,0.5); font-size: 24px;}
        .rank-2 { color: #c0c0c0; text-shadow: 0 0 10px rgba(192,192,192,0.5); font-size: 22px;}
        .rank-3 { color: #cd7f32; text-shadow: 0 0 10px rgba(205,127,50,0.5); font-size: 22px;}
        
        .team-col { font-weight: bold; text-align: left; padding-left: 20px; color: white; font-size: 22px;}
        
        .time-box { font-family: 'Orbitron', monospace; font-size: 20px; font-weight: 700; color: white; }
        .final-time-box { font-family: 'Orbitron', monospace; font-size: 24px; font-weight: 900; color: var(--neon-green); text-shadow: 0 0 10px rgba(0,255,136,0.3); }
        .digit-slot { display: inline-block; width: 0.8em; text-align: center; }

        .mod-container { display: flex; gap: 8px; justify-content: center; align-items: center; flex-wrap: wrap; }
        .mod-pill { display: inline-flex; justify-content: center; align-items: center; width: 110px; padding: 6px 0; border-radius: 4px; font-size: 13px; font-weight: bold; font-family: 'Orbitron', sans-serif; letter-spacing: 1px; box-sizing: border-box; }
        .mod-pt { background: rgba(39, 174, 96, 0.2); color: #2ecc71; border: 1px solid #2ecc71;}
        .mod-obs { background: rgba(230, 168, 0, 0.2); color: #f39c12; border: 1px solid #f39c12;}
        .mod-der { background: rgba(231, 36, 41, 0.2); color: #e74c3c; border: 1px solid #e74c3c;}
        .mod-none { color: #6e7681; font-size: 14px; font-weight: bold; }

        @keyframes pulse-gold { 0% { box-shadow: inset 0 0 10px rgba(255,215,0,0.1); } 50% { box-shadow: inset 0 0 30px rgba(255,215,0,0.5); } 100% { box-shadow: inset 0 0 10px rgba(255,215,0,0.1); } }
        @keyframes pulse-silver { 0% { box-shadow: inset 0 0 10px rgba(192,192,192,0.1); } 50% { box-shadow: inset 0 0 30px rgba(192,192,192,0.4); } 100% { box-shadow: inset 0 0 10px rgba(192,192,192,0.1); } }
        @keyframes pulse-bronze { 0% { box-shadow: inset 0 0 10px rgba(205,127,50,0.1); } 50% { box-shadow: inset 0 0 30px rgba(205,127,50,0.4); } 100% { box-shadow: inset 0 0 10px rgba(205,127,50,0.1); } }

        .podium-1 td { background: rgba(255, 215, 0, 0.1) !important; border-top: 2px solid #ffd700; border-bottom: 2px solid #ffd700; animation: pulse-gold 2s infinite; }
        .podium-2 td { background: rgba(192, 192, 192, 0.08) !important; border-top: 1px solid #c0c0c0; border-bottom: 1px solid #c0c0c0; animation: pulse-silver 2.5s infinite; }
        .podium-3 td { background: rgba(205, 127, 50, 0.08) !important; border-top: 1px solid #cd7f32; border-bottom: 1px solid #cd7f32; animation: pulse-bronze 3s infinite; }
        .medal-icon { margin-left: 10px; font-size: 24px; filter: drop-shadow(0 0 5px rgba(255,255,255,0.5)); }
    </style>
</head>
<body>

<div class="header">
    <!-- UPDATED HEADER WITH LOGO -->
    <div class="title-area" style="display: flex; align-items: center; gap: 20px;">
        <img src="TRACER.png" alt="Tracer Logo" style="height: 70px; border-radius: 10px;">
        <div>
            <h1>SEMI-AUTO TRACER</h1>
            <h2>LIVE LEADERBOARD</h2>
        </div>
    </div>
    <a href="login.html" class="admin-link">ADMIN LOGIN 🔐</a>
</div>
