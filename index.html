<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Leaderboard - Makerobot Semi-Auto Tracer</title>
    <link rel="icon" type="image/png" href="TRACER.png">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --tracer-grad: linear-gradient(90deg, #5c4300 0%, #e6a800 100%);
            --gold-accent: #e6a800;
            --bg-dark: #090c10;
            --panel-bg: #111822;
            --border-glow: #1f4179;
            --text-main: #c9d1d9;
            --neon-green: #00ff88;
        }

        body { 
            font-family: 'Rajdhani', sans-serif; 
            background-color: var(--bg-dark); 
            color: var(--text-main); 
            padding: 20px; 
            margin: 0;
            background-image: radial-gradient(circle at 50% 0%, rgba(31, 65, 121, 0.2) 0%, transparent 60%);
        }
        
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #30363d; padding-bottom: 15px; margin-bottom: 20px;}
        .title-area h1 { font-family: 'Orbitron', sans-serif; color: white; margin: 0; font-size: 28px; letter-spacing: 2px;}
        .title-area h2 { font-family: 'Orbitron', sans-serif; color: var(--gold-accent); margin: 5px 0 0 0; font-size: 16px; letter-spacing: 3px;}
        
        .admin-link { color: #8b949e; text-decoration: none; font-family: 'Orbitron', sans-serif; font-size: 12px; font-weight: bold; border: 1px solid #30363d; padding: 5px 10px; border-radius: 4px; transition: 0.3s; }
        .admin-link:hover { background: rgba(255,255,255,0.1); color: white;}

        .selector-box { background: var(--panel-bg); padding: 20px; border-radius: 8px; border: 1px solid var(--border-glow); text-align: center; margin-bottom: 20px;}
        select { padding: 10px; font-size: 16px; font-family: 'Rajdhani', sans-serif; background: #0d1117; color: white; border: 1px solid var(--gold-accent); border-radius: 4px; width: 300px; max-width: 100%;}
        
        .leaderboard-container { display: none; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 18px;}
        th { background: #0d1117; color: #8b949e; font-family: 'Orbitron', sans-serif; padding: 15px; border-bottom: 2px solid var(--gold-accent); text-align: center; letter-spacing: 1px; font-size: 14px;}
        td { padding: 15px; border-bottom: 1px solid #30363d; text-align: center; vertical-align: middle; background: rgba(17, 24, 34, 0.6); transition: all 0.5s ease;}
        
        tr.active-run td { background: rgba(31, 65, 121, 0.4); border-left: 3px solid var(--neon-green);}
        
        .rank-col { font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 20px; color: #8b949e; width: 80px;}
        .rank-1 { color: #ffd700; text-shadow: 0 0 10px rgba(255,215,0,0.5); font-size: 24px;}
        .rank-2 { color: #c0c0c0; text-shadow: 0 0 10px rgba(192,192,192,0.5); font-size: 22px;}
        .rank-3 { color: #cd7f32; text-shadow: 0 0 10px rgba(205,127,50,0.5); font-size: 22px;}
        
        .team-col { font-weight: bold; text-align: left; padding-left: 20px; color: white; font-size: 22px;}
        
        .time-box { font-family: 'Orbitron', monospace; font-size: 20px; font-weight: 700; color: white; }
        .final-time-box { font-family: 'Orbitron', monospace; font-size: 24px; font-weight: 900; color: var(--neon-green); text-shadow: 0 0 10px rgba(0,255,136,0.3); }
        .digit-slot { display: inline-block; width: 0.8em; text-align: center; }

        .mod-container { display: flex; gap: 8px; justify-content: center; align-items: center; flex-wrap: wrap; }
        .mod-pill { display: inline-flex; justify-content: center; align-items: center; width: 110px; padding: 6px 0; border-radius: 4px; font-size: 13px; font-weight: bold; font-family: 'Orbitron', sans-serif; letter-spacing: 1px; box-sizing: border-box; }
        .mod-pt { background: rgba(39, 174, 96, 0.2); color: #2ecc71; border: 1px solid #2ecc71;}
        .mod-obs { background: rgba(230, 168, 0, 0.2); color: #f39c12; border: 1px solid #f39c12;}
        .mod-der { background: rgba(231, 36, 41, 0.2); color: #e74c3c; border: 1px solid #e74c3c;}
        .mod-none { color: #6e7681; font-size: 14px; font-weight: bold; }

        @keyframes pulse-gold { 0% { box-shadow: inset 0 0 10px rgba(255,215,0,0.1); } 50% { box-shadow: inset 0 0 30px rgba(255,215,0,0.5); } 100% { box-shadow: inset 0 0 10px rgba(255,215,0,0.1); } }
        @keyframes pulse-silver { 0% { box-shadow: inset 0 0 10px rgba(192,192,192,0.1); } 50% { box-shadow: inset 0 0 30px rgba(192,192,192,0.4); } 100% { box-shadow: inset 0 0 10px rgba(192,192,192,0.1); } }
        @keyframes pulse-bronze { 0% { box-shadow: inset 0 0 10px rgba(205,127,50,0.1); } 50% { box-shadow: inset 0 0 30px rgba(205,127,50,0.4); } 100% { box-shadow: inset 0 0 10px rgba(205,127,50,0.1); } }
        .medal-icon { margin-left: 10px; font-size: 24px; filter: drop-shadow(0 0 5px rgba(255,255,255,0.5)); }

        /* SPLASH SCREEN CSS */
        .splash-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(9, 12, 16, 0.98);
            backdrop-filter: blur(15px);
            z-index: 9999;
            display: none; 
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            cursor: pointer;
        }
        
        .splash-header, .splash-team, .splash-timer, .splash-details, .click-dismiss { transition: opacity 0.4s ease, filter 0.4s ease; }
        .dim-bg { opacity: 0.1 !important; filter: blur(3px); }

        .splash-header { font-family: 'Orbitron', sans-serif; font-size: 2.5em; color: #ff4757; letter-spacing: 5px; margin-bottom: 10px; text-transform: uppercase; text-shadow: 0 0 20px rgba(255, 71, 87, 0.4);}
        .splash-team { font-family: 'Orbitron', sans-serif; font-size: 4em; font-weight: 900; color: white; margin-bottom: 20px; text-transform: uppercase; text-shadow: 0 0 30px rgba(255,255,255,0.3); line-height: 1;}
        .splash-timer { font-family: 'Orbitron', monospace; font-size: 8em; font-weight: 900; color: var(--neon-green); text-shadow: 0 0 50px rgba(0,255,136,0.6); letter-spacing: -2px; line-height: 1; display: flex; justify-content: center;}
        
        .splash-details { margin-top: 30px; font-size: 1.8em; color: #8b949e; font-family: 'Orbitron', sans-serif; display: none; background: rgba(0,0,0,0.5); padding: 15px 40px; border-radius: 12px; border: 1px solid #30363d;}
        .splash-details span { color: white; margin: 0 15px; font-weight: bold;}
        .splash-pts { color: #2ecc71 !important; }
        .splash-obs { color: #f39c12 !important; }
        .splash-der { color: #e74c3c !important; }
        .click-dismiss { margin-top: 30px; color: #6e7681; font-family: 'Rajdhani', sans-serif; font-size: 16px; letter-spacing: 2px;}

        /* THE GIANT "START!" & "FINISH!" TEXTS */
        .splash-start-msg, .splash-finish-msg {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            z-index: 10000;
            pointer-events: none;
            display: none;
        }
        
        .splash-start-msg {
            font-size: 18em;
            color: var(--neon-green);
            text-shadow: 0 0 60px rgba(0,255,136,1);
        }
        
        .splash-finish-msg {
            font-size: 14em; /* Slightly smaller because the word is longer */
            color: var(--gold-accent);
            text-shadow: 0 0 60px rgba(230, 168, 0, 1);
        }
        
        /* The pop-and-fade animation shared by both */
        .anim-blast { animation: blastOut 1.5s ease-in-out forwards; }
        @keyframes blastOut {
            0% { transform: translate(-50%, -50%) scale(0.2); opacity: 0; }
            15% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
            70% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(3); opacity: 0; }
        }

        @media (max-width: 768px) {
            .splash-header { font-size: 1.8em; letter-spacing: 3px; }
            .splash-team { font-size: 2.5em; margin-bottom: 10px; }
            .splash-timer { font-size: 4.5em; text-shadow: 0 0 30px rgba(0,255,136,0.4); }
            .splash-start-msg { font-size: 8em; }
            .splash-finish-msg { font-size: 6em; }
            .splash-details { font-size: 1.2em; padding: 10px 20px; margin-top: 20px; }
        }

        @media (max-width: 480px) {
            .splash-header { font-size: 1.2em; letter-spacing: 2px; }
            .splash-team { font-size: 2em; margin-bottom: 5px; }
            .splash-timer { font-size: 3.2em; letter-spacing: -1px; }
            .splash-start-msg { font-size: 6em; }
            .splash-finish-msg { font-size: 4em; }
            .splash-details { font-size: 0.9em; padding: 10px; margin-top: 15px; }
            .click-dismiss { font-size: 12px; margin-top: 15px; }
            .title-area h1 { font-size: 20px; }
            .title-area img { height: 50px !important; }
            th, td { padding: 8px; font-size: 14px; }
            .team-col { font-size: 16px; padding-left: 5px !important; }
            .rank-col { font-size: 16px; width: 40px; }
            .time-box { font-size: 16px; }
            .final-time-box { font-size: 18px; }
        }
    </style>
</head>
<body>

<!-- SPLASH SCREEN OVERLAY -->
<div id="splashScreen" class="splash-overlay" onclick="hideSplash()">
    <!-- THE GIANT ANIMATIONS -->
    <div id="splashStartMessage" class="splash-start-msg">START!</div>
    <div id="splashFinishMessage" class="splash-finish-msg">FINISH!</div>
    
    <div id="splashHeader" class="splash-header">🔥 LIVE RUN 🔥</div>
    <div id="splashTeamName" class="splash-team">TEAM ALPHA</div>
    <div id="splashTimer" class="splash-timer">00:00.00</div>
    
    <div id="splashDetails" class="splash-details">
        RAW: <span id="spRaw">00:00.00</span> | 
        PT: <span id="spPt" class="splash-pts">0</span> | 
        OBS: <span id="spObs" class="splash-obs">0</span> | 
        DER: <span id="spDer" class="splash-der">0</span>
    </div>
    <div id="clickDismiss" class="click-dismiss">( CLICK ANYWHERE TO DISMISS )</div>
</div>

<div class="header">
    <div class="title-area" style="display: flex; align-items: center; gap: 20px;">
        <img src="TRACER.png" alt="Tracer Logo" style="height: 70px; border-radius: 10px;">
        <div>
            <h1>SEMI-AUTO TRACER</h1>
            <h2>LIVE LEADERBOARD</h2>
        </div>
    </div>
    <a href="login.html" class="admin-link">ADMIN LOGIN 🔐</a>
</div>

<div class="selector-box" id="selectorBox">
    <h3 style="font-family: 'Orbitron', sans-serif; color: white; margin-top:0;">SELECT TOURNAMENT DIRECTORY</h3>
    <select id="gameSelect" onchange="loadGameData(this.value)">
        <option value="">-- LOADING SYSTEMS --</option>
    </select>
</div>

<div class="leaderboard-container" id="leaderboardContainer">
    <h2 id="activeGameTitle" style="text-align: center; font-family: 'Orbitron', sans-serif; color: var(--gold-accent); margin-bottom: 5px;"></h2>
    <div id="gameStatusLabel" style="text-align: center; color: #8b949e; font-size: 14px; margin-bottom: 20px; font-weight: bold; letter-spacing: 1px;">STATUS: IN PROGRESS</div>
    
    <div style="overflow-x: auto;">
        <table>
            <thead>
                <tr>
                    <th class="rank-col">RANK</th>
                    <th style="text-align:left; padding-left: 20px;">TEAM</th>
                    <th>RAW TIME</th>
                    <th>MODIFIERS</th>
                    <th>FINAL SCORE</th>
                </tr>
            </thead>
            <tbody id="leaderboardBody">
                <!-- Data populated via JS -->
            </tbody>
        </table>
    </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, onSnapshot, doc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC70m3k8VSSIshbjPJuOizEADA8mBV79ug",
    authDomain: "makerobot-tracer-semi-auto.firebaseapp.com",
    projectId: "makerobot-tracer-semi-auto",
    storageBucket: "makerobot-tracer-semi-auto.firebasestorage.app",
    messagingSenderId: "384231222540",
    appId: "1:384231222540:web:a9c892c9c4c13698e7ed29"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  let currentUnsubGame = null;
  let currentUnsubTeams = null;
  let liveTimerIntervals = {};
  let isRaceLockedGlobal = false;
  
  let currentlyRunningTeamId = null;
  let splashTimerInterval = null;
  let splashTimeout = null;

  function formatTimeHtml(ms) {
      if(ms === null || ms === undefined || ms < 0) return "--:--.--";
      let date = new Date(ms);
      let m = String(date.getUTCMinutes()).padStart(2, '0');
      let s = String(date.getUTCSeconds()).padStart(2, '0');
      let msStr = String(Math.floor(date.getUTCMilliseconds() / 10)).padStart(2, '0');
      let raw = `${m}:${s}.${msStr}`;
      let html = '';
      for(let char of raw) { html += `<span class="digit-slot">${char}</span>`; }
      return html;
  }

  function calculateAdjustedTime(rawTimeMs, points, obstacles, derails) {
      if (rawTimeMs === null || rawTimeMs === undefined) return null;
      let pts = points || 0;
      let obs = obstacles || 0;
      let drs = derails || 0;
      let adjusted = rawTimeMs - (pts * 10000) + (obs * 10000) + (drs * 15000);
      return Math.max(0, adjusted);
  }

  window.hideSplash = function() {
      document.getElementById('splashScreen').style.display = 'none';
      
      document.getElementById('splashStartMessage').style.display = 'none';
      document.getElementById('splashFinishMessage').style.display = 'none';
      
      document.getElementById('splashHeader').classList.remove('dim-bg');
      document.getElementById('splashTeamName').classList.remove('dim-bg');
      document.getElementById('splashTimer').classList.remove('dim-bg');
      document.getElementById('splashDetails').classList.remove('dim-bg');
      document.getElementById('clickDismiss').classList.remove('dim-bg');
      
      clearInterval(splashTimerInterval);
      clearTimeout(splashTimeout);
  }

  function showSplashRunning(team) {
      clearTimeout(splashTimeout);
      document.getElementById('splashScreen').style.display = 'flex';
      
      let header = document.getElementById('splashHeader');
      let teamName = document.getElementById('splashTeamName');
      let timer = document.getElementById('splashTimer');
      let startMsg = document.getElementById('splashStartMessage');
      let finishMsg = document.getElementById('splashFinishMessage');
      let dismissMsg = document.getElementById('clickDismiss');
      
      finishMsg.style.display = 'none'; // Ensure finish msg is hidden
      
      header.innerText = '🔥 LIVE RUN 🔥';
      header.style.color = '#ff4757';
      header.style.textShadow = '0 0 20px rgba(255, 71, 87, 0.4)';
      teamName.innerText = team.name;
      document.getElementById('splashDetails').style.display = 'none';

      clearInterval(splashTimerInterval);
      
      let elapsedCheck = Date.now() - team.raceStartTimestamp;
      
      if (elapsedCheck < 2000) {
          startMsg.style.display = 'block';
          startMsg.classList.remove('anim-blast');
          void startMsg.offsetWidth; 
          startMsg.classList.add('anim-blast');
          
          header.classList.add('dim-bg');
          teamName.classList.add('dim-bg');
          timer.classList.add('dim-bg');
          dismissMsg.classList.add('dim-bg');
          
          setTimeout(() => {
              header.classList.remove('dim-bg');
              teamName.classList.remove('dim-bg');
              timer.classList.remove('dim-bg');
              dismissMsg.classList.remove('dim-bg');
              startMsg.style.display = 'none';
          }, 1400);
      } else {
          startMsg.style.display = 'none';
          header.classList.remove('dim-bg');
          teamName.classList.remove('dim-bg');
          timer.classList.remove('dim-bg');
          dismissMsg.classList.remove('dim-bg');
      }
      
      const updateTimer = () => {
          let elapsed = Date.now() - team.raceStartTimestamp;
          let adj = calculateAdjustedTime(elapsed, team.points, team.obstacles, team.derails);
          timer.innerHTML = formatTimeHtml(adj);
      };
      
      updateTimer(); 
      splashTimerInterval = setInterval(updateTimer, 50);
  }

  function showSplashFinished(team) {
      clearInterval(splashTimerInterval);
      document.getElementById('splashScreen').style.display = 'flex';
      
      let header = document.getElementById('splashHeader');
      let teamName = document.getElementById('splashTeamName');
      let timer = document.getElementById('splashTimer');
      let details = document.getElementById('splashDetails');
      let startMsg = document.getElementById('splashStartMessage');
      let finishMsg = document.getElementById('splashFinishMessage');
      let dismissMsg = document.getElementById('clickDismiss');

      startMsg.style.display = 'none';
      
      header.innerText = '🏁 RACE FINISHED 🏁';
      header.style.color = 'var(--gold-accent)';
      header.style.textShadow = '0 0 20px rgba(230, 168, 0, 0.4)';
      teamName.innerText = team.name;
      
      timer.innerHTML = formatTimeHtml(team.totalTimeMs);
      
      details.style.display = 'inline-block';
      document.getElementById('spRaw').innerHTML = formatTimeHtml(team.raceTimeMs);
      document.getElementById('spPt').innerText = team.points || 0;
      document.getElementById('spObs').innerText = team.obstacles || 0;
      document.getElementById('spDer').innerText = team.derails || 0;

      // TRIGGER THE GOLDEN FINISH ANIMATION
      finishMsg.style.display = 'block';
      finishMsg.classList.remove('anim-blast');
      void finishMsg.offsetWidth; 
      finishMsg.classList.add('anim-blast');
      
      header.classList.add('dim-bg');
      teamName.classList.add('dim-bg');
      timer.classList.add('dim-bg');
      details.classList.add('dim-bg');
      dismissMsg.classList.add('dim-bg');

      // Un-dim after 1.4 seconds
      setTimeout(() => {
          header.classList.remove('dim-bg');
          teamName.classList.remove('dim-bg');
          timer.classList.remove('dim-bg');
          details.classList.remove('dim-bg');
          dismissMsg.classList.remove('dim-bg');
          finishMsg.style.display = 'none';
      }, 1400);

      // Auto-hide the entire splash screen after 9 seconds (1s for anim + 8s reading time)
      clearTimeout(splashTimeout);
      splashTimeout = setTimeout(() => {
          window.hideSplash();
      }, 9000);
  }

  onSnapshot(collection(db, "tracer_games"), (snapshot) => {
      const select = document.getElementById("gameSelect");
      const currentVal = select.value;
      select.innerHTML = '<option value="">-- CHOOSE A TOURNAMENT --</option>';
      
      snapshot.forEach(docSnap => {
          const game = docSnap.data();
          const option = document.createElement("option");
          option.value = docSnap.id;
          option.text = `${game.name} ${game.isRaceLocked ? '(FINISHED)' : ''}`;
          select.appendChild(option);
      });
      if(currentVal) select.value = currentVal;
  });

  window.loadGameData = function(gameId) {
      if(!gameId) {
          document.getElementById("leaderboardContainer").style.display = "none";
          window.hideSplash();
          return;
      }
      
      document.getElementById("leaderboardContainer").style.display = "block";

      if(currentUnsubGame) currentUnsubGame();
      if(currentUnsubTeams) currentUnsubTeams();
      for(let key in liveTimerIntervals) clearInterval(liveTimerIntervals[key]);
      window.hideSplash();

      currentUnsubGame = onSnapshot(doc(db, "tracer_games", gameId), (docSnap) => {
          const game = docSnap.data();
          if(!game) return;
          
          isRaceLockedGlobal = game.isRaceLocked;
          document.getElementById("activeGameTitle").innerText = game.name.toUpperCase();
          
          if(isRaceLockedGlobal) {
              document.getElementById("gameStatusLabel").innerHTML = "🏆 OFFICIAL TOURNAMENT RESULTS LOCKED 🏆";
              document.getElementById("gameStatusLabel").style.color = "var(--gold-accent)";
          } else {
              document.getElementById("gameStatusLabel").innerText = "STATUS: LIVE MATCH IN PROGRESS";
              document.getElementById("gameStatusLabel").style.color = "#8b949e";
          }
      });

      currentUnsubTeams = onSnapshot(collection(db, "tracer_games", gameId, "teams"), (snapshot) => {
          let teams = [];
          snapshot.forEach(d => teams.push({ id: d.id, ...d.data() }));
          
          // SPLASH SCREEN LOGIC
          let runningTeam = teams.find(t => t.raceStartTimestamp !== null);
          
          if (runningTeam) {
              currentlyRunningTeamId = runningTeam.id;
              showSplashRunning(runningTeam);
          } else if (currentlyRunningTeamId) {
              // This triggers exactly when a team stops running!
              let recentlyFinishedTeam = teams.find(t => t.id === currentlyRunningTeamId && t.raceTimeMs !== null);
              if (recentlyFinishedTeam) {
                  showSplashFinished(recentlyFinishedTeam);
              } else {
                  window.hideSplash(); 
              }
              currentlyRunningTeamId = null;
          }

          // TABLE LOGIC
          teams.sort((a, b) => {
              if(a.totalTimeMs !== null && b.totalTimeMs !== null) return a.totalTimeMs - b.totalTimeMs;
              if(a.totalTimeMs !== null) return -1;
              if(b.totalTimeMs !== null) return 1;
              if(a.raceStartTimestamp && !b.raceStartTimestamp) return -1;
              if(!a.raceStartTimestamp && b.raceStartTimestamp) return 1;
              return a.name.localeCompare(b.name);
          });

          const tbody = document.getElementById("leaderboardBody");
          tbody.innerHTML = "";
          let rank = 1;

          teams.forEach((team) => {
              let isFinished = team.totalTimeMs !== null;
              let isRunning = team.raceStartTimestamp !== null;
              
              let trClass = isRunning ? "active-run" : "";
              let medalIcon = "";
              
              if (isFinished && isRaceLockedGlobal) {
                  if (rank === 1) { trClass += " podium-1"; medalIcon = `<span class="medal-icon">🏆</span>`; }
                  else if (rank === 2) { trClass += " podium-2"; medalIcon = `<span class="medal-icon">🥈</span>`; }
                  else if (rank === 3) { trClass += " podium-3"; medalIcon = `<span class="medal-icon">🥉</span>`; }
              }
              
              let rankHtml = `<span class="rank-col">-</span>`;
              if (isFinished) {
                  let rClass = rank === 1 ? "rank-1" : rank === 2 ? "rank-2" : rank === 3 ? "rank-3" : "";
                  rankHtml = `<span class="rank-col ${rClass}">#${rank}</span>`;
                  rank++;
              }

              let modHtml = `<div class="mod-container">`;
              if(team.points > 0) modHtml += `<span class="mod-pill mod-pt">-${team.points*10}s (PT)</span>`;
              if(team.obstacles > 0) modHtml += `<span class="mod-pill mod-obs">+${team.obstacles*10}s (OBS)</span>`;
              if(team.derails > 0) modHtml += `<span class="mod-pill mod-der">+${team.derails*15}s (DER)</span>`;
              if(!team.points && !team.obstacles && !team.derails) modHtml += `<span class="mod-none">NONE</span>`;
              modHtml += `</div>`;

              let rawDisplay = "--:--.--";
              let finalDisplay = "--:--.--";
              let rawColor = "white";

              if (isFinished) {
                  rawDisplay = formatTimeHtml(team.raceTimeMs);
                  finalDisplay = formatTimeHtml(team.totalTimeMs);
                  rawColor = "#8b949e";
              } else if (isRunning) {
                  rawDisplay = `<span id="liveRaw_${team.id}">00:00.00</span>`;
                  finalDisplay = `<span id="liveFinal_${team.id}">00:00.00</span>`;
                  rawColor = "var(--gold-accent)";
                  
                  if(!liveTimerIntervals[team.id]) {
                      liveTimerIntervals[team.id] = setInterval(() => {
                          let elapsed = Date.now() - team.raceStartTimestamp;
                          let liveRawEl = document.getElementById(`liveRaw_${team.id}`);
                          let liveFinalEl = document.getElementById(`liveFinal_${team.id}`);
                          if(liveRawEl) liveRawEl.innerHTML = formatTimeHtml(elapsed);
                          if(liveFinalEl) liveFinalEl.innerHTML = formatTimeHtml(calculateAdjustedTime(elapsed, team.points, team.obstacles, team.derails));
                      }, 50);
                  }
              } else {
                  rawDisplay = formatTimeHtml(0);
                  finalDisplay = formatTimeHtml(0);
                  rawColor = "#484f58";
              }

              tbody.innerHTML += `
                  <tr class="${trClass}">
                      <td>${rankHtml}</td>
                      <td class="team-col">${team.name} ${medalIcon}</td>
                      <td class="time-box" style="color: ${rawColor}">${rawDisplay}</td>
                      <td>${modHtml}</td>
                      <td class="final-time-box" style="${!isFinished && !isRunning ? 'color:#484f58; text-shadow:none;' : ''}">${finalDisplay}</td>
                  </tr>
              `;
          });
      });
  };
</script>

</body>
</html>
